<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serverless Voice Caller</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            text-align: center; 
            background: #0f172a; 
            color: #f8fafc; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
        }
        .card { 
            background: #1e293b; 
            padding: 24px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
            max-width: 400px; 
            width: 100%; 
            margin-top: 40px; 
        }
        input, button { 
            padding: 12px 16px; 
            margin: 8px 0; 
            border-radius: 8px; 
            border: none; 
            font-size: 16px; 
            width: 100%; 
        }
        input { 
            background: #334155; 
            color: white; 
            outline: none; 
        }
        input::placeholder { color: #94a3b8; }
        button { 
            background-color: #2563eb; 
            color: white; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.2s; 
        }
        button:hover { background-color: #1d4ed8; }
        .btn-danger { background-color: #dc2626; }
        .btn-danger:hover { background-color: #b91c1c; }
        #call-ui { display: none; width: 100%; max-width: 400px; }
        .status-box { margin-top: 15px; font-size: 14px; color: #94a3b8; }
    </style>
</head>
<body onclick="unlockAudio()">

    <h1>P2P Voice Calling</h1>

    <!-- Step 1: Set Username -->
    <div id="login-ui" class="card">
        <h3>Choose Your Username</h3>
        <input type="text" id="username-input" placeholder="e.g. alex">
        <button onclick="initPeer()">Join App</button>
    </div>

    <!-- Step 2: Call Screen -->
    <div id="call-ui" class="card">
        <p>Your Username: <strong id="my-id-display" style="color: #38bdf8;"></strong></p>
        
        <input type="text" id="remote-id-input" placeholder="Friend's Username">
        <button onclick="makeCall()">Call Friend</button>
        <button onclick="endCall()" class="btn-danger">Hang Up</button>
        
        <div class="status-box" id="call-status">Status: Ready</div>
        <audio id="remote-audio" autoplay playsinline></audio>
    </div>

    <script>
        let peer = null;
        let localStream = null;
        let currentCall = null;
        let myUsername = "";

        const peerOptions = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:global.stun.twilio.com:3478' }
                ]
            }
        };

        function unlockAudio() {
            const audioEl = document.getElementById('remote-audio');
            if (audioEl && audioEl.paused) {
                audioEl.play().catch(() => {});
            }
        }

        async function initPeer() {
            myUsername = document.getElementById('username-input').value.trim().toLowerCase();
            if (!myUsername) return alert('Please enter a username');

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: false, audio: true });
            } catch (err) {
                alert('Microphone access is required: ' + err.message);
                return;
            }

            createPeerConnection();
        }

        function createPeerConnection() {
            peer = new Peer(myUsername, peerOptions);

            peer.on('open', (id) => {
                document.getElementById('login-ui').style.display = 'none';
                document.getElementById('call-ui').style.display = 'block';
                document.getElementById('my-id-display').innerText = id;
                document.getElementById('call-status').innerText = 'Status: Connected to network';
            });

            // Automatically handle network drops and attempt to reconnect
            peer.on('disconnected', () => {
                document.getElementById('call-status').innerText = 'Status: Network dropped, reconnecting...';
                console.log('Peer disconnected from server. Attempting reconnection...');
                setTimeout(() => {
                    if (peer && !peer.destroyed) {
                        peer.reconnect();
                    }
                }, 2000);
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    alert('That username is already taken. Please pick another one.');
                    document.getElementById('login-ui').style.display = 'block';
                    document.getElementById('call-ui').style.display = 'none';
                } else {
                    console.warn('Peer error encountered:', err.type);
                }
            });

            peer.on('call', (call) => {
                const acceptCall = confirm(`Incoming voice call from: ${call.peer}. Answer?`);
                if (acceptCall) {
                    call.answer(localStream);
                    setupCallEvents(call);
                }
            });
        }

        function makeCall() {
            const remoteId = document.getElementById('remote-id-input').value.trim().toLowerCase();
            if (!remoteId) return alert("Enter your friend's username");

            document.getElementById('call-status').innerText = `Calling ${remoteId}...`;
            const call = peer.call(remoteId, localStream);
            setupCallEvents(call);
        }

        function setupCallEvents(call) {
            currentCall = call;

            if (call.peerConnection) {
                call.peerConnection.oniceconnectionstatechange = () => {
                    const state = call.peerConnection.iceConnectionState;
                    console.log('ICE Connection State:', state);
                    if (state === 'disconnected' || state === 'failed') {
                        document.getElementById('call-status').innerText = 'Status: Connection unstable...';
                    }
                };
            }

            call.on('stream', (remoteStream) => {
                document.getElementById('call-status').innerText = `Connected!`;
                const audioEl = document.getElementById('remote-audio');
                audioEl.srcObject = remoteStream;
                audioEl.play().catch(e => {
                    console.log("Autoplay blocked:", e);
                    document.getElementById('call-status').innerText = `Connected! Tap screen to hear audio.`;
                });
            });

            call.on('close', () => {
                document.getElementById('call-status').innerText = 'Call ended';
                document.getElementById('remote-audio').srcObject = null;
            });
        }

        function endCall() {
            if (currentCall) {
                currentCall.close();
                document.getElementById('call-status').innerText = 'Call ended';
                document.getElementById('remote-audio').srcObject = null;
            }
        }
    </script>
</body>
</html>
