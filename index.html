<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serverless Voice Caller</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            text-align: center; 
            background: #0f172a; 
            color: #f8fafc; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
        }
        .card { 
            background: #1e293b; 
            padding: 24px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
            max-width: 400px; 
            width: 100%; 
            margin-top: 40px; 
        }
        input, button { 
            padding: 12px 16px; 
            margin: 8px 0; 
            border-radius: 8px; 
            border: none; 
            font-size: 16px; 
            width: 100%; 
        }
        input { 
            background: #334155; 
            color: white; 
            outline: none; 
        }
        input::placeholder { color: #94a3b8; }
        button { 
            background-color: #2563eb; 
            color: white; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.2s; 
        }
        button:hover { background-color: #1d4ed8; }
        .btn-danger { background-color: #dc2626; }
        .btn-danger:hover { background-color: #b91c1c; }
        #call-ui { display: none; width: 100%; max-width: 400px; }
        .status-box { margin-top: 15px; font-size: 14px; color: #94a3b8; }
    </style>
</head>
<body>

    <h1>P2P Voice Calling</h1>

    <!-- Step 1: Set Username -->
    <div id="login-ui" class="card">
        <h3>Choose Your Username</h3>
        <input type="text" id="username-input" placeholder="e.g. alex">
        <button onclick="initPeer()">Join App</button>
    </div>

    <!-- Step 2: Call Screen -->
    <div id="call-ui" class="card">
        <p>Your Username: <strong id="my-id-display" style="color: #38bdf8;"></strong></p>
        
        <input type="text" id="remote-id-input" placeholder="Friend's Username">
        <button onclick="makeCall()">Call Friend</button>
        <button onclick="endCall()" class="btn-danger">Hang Up</button>
        
        <div class="status-box" id="call-status">Status: Ready</div>
        <!-- Hidden audio element to play remote sound -->
        <audio id="remote-audio" autoplay></audio>
    </div>

    <script>
        let peer = null;
        let localStream = null;
        let currentCall = null;

        async function initPeer() {
            const username = document.getElementById('username-input').value.trim().toLowerCase();
            if (!username) return alert('Please enter a username');

            // Request AUDIO ONLY (no camera needed)
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: false, audio: true });
            } catch (err) {
                alert('Microphone access is required: ' + err.message);
                return;
            }

            peer = new Peer(username);

            peer.on('open', (id) => {
                document.getElementById('login-ui').style.display = 'none';
                document.getElementById('call-ui').style.display = 'block';
                document.getElementById('my-id-display').innerText = id;
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    alert('That username is already taken. Please pick another one.');
                } else {
                    alert('Connection Error: ' + err.type);
                }
            });

            // Handle Incoming Calls
            peer.on('call', (call) => {
                const acceptCall = confirm(`Incoming voice call from: ${call.peer}. Answer?`);
                if (acceptCall) {
                    call.answer(localStream);
                    currentCall = call;
                    document.getElementById('call-status').innerText = `Connected with ${call.peer}`;

                    call.on('stream', (remoteStream) => {
                        document.getElementById('remote-audio').srcObject = remoteStream;
                    });

                    call.on('close', () => {
                        document.getElementById('call-status').innerText = 'Call ended';
                        document.getElementById('remote-audio').srcObject = null;
                    });
                }
            });
        }

        function makeCall() {
            const remoteId = document.getElementById('remote-id-input').value.trim().toLowerCase();
            if (!remoteId) return alert("Enter your friend's username");

            document.getElementById('call-status').innerText = `Calling ${remoteId}...`;
            const call = peer.call(remoteId, localStream);
            currentCall = call;

            call.on('stream', (remoteStream) => {
                document.getElementById('call-status').innerText = `Connected with ${remoteId}`;
                document.getElementById('remote-audio').srcObject = remoteStream;
            });

            call.on('close', () => {
                document.getElementById('call-status').innerText = 'Call ended';
                document.getElementById('remote-audio').srcObject = null;
            });
        }

        function endCall() {
            if (currentCall) {
                currentCall.close();
                document.getElementById('call-status').innerText = 'Call ended';
                document.getElementById('remote-audio').srcObject = null;
            }
        }
    </script>
</body>
</html>
