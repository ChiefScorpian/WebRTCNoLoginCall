<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serverless P2P Caller</title>
    <!-- Include PeerJS Library directly from CDN -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            text-align: center; 
            background: #0f172a; 
            color: #f8fafc; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
        }
        .card { 
            background: #1e293b; 
            padding: 24px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
            max-width: 400px; 
            width: 100%; 
            margin-top: 40px; 
        }
        input, button { 
            padding: 12px 16px; 
            margin: 8px 0; 
            border-radius: 8px; 
            border: none; 
            font-size: 16px; 
            width: 100%; 
        }
        input { 
            background: #334155; 
            color: white; 
            outline: none; 
        }
        input::placeholder { color: #94a3b8; }
        button { 
            background-color: #2563eb; 
            color: white; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.2s; 
        }
        button:hover { background-color: #1d4ed8; }
        .btn-danger { background-color: #dc2626; }
        .btn-danger:hover { background-color: #b91c1c; }
        .video-container { 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
            margin-top: 20px; 
            width: 100%; 
            max-width: 700px; 
        }
        @media (min-width: 600px) {
            .video-container { flex-direction: row; }
        }
        .video-box {
            flex: 1;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }
        video { 
            width: 100%; 
            height: 240px; 
            object-fit: cover; 
            background: #000; 
        }
        #local-video { transform: scaleX(-1); } /* Mirror effect for self view */
        .video-label {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        #call-ui { display: none; width: 100%; max-width: 700px; }
    </style>
</head>
<body>

    <h1>P2P Voice & Video</h1>

    <!-- Step 1: Set Username -->
    <div id="login-ui" class="card">
        <h3>Choose Your Username</h3>
        <input type="text" id="username-input" placeholder="e.g. alex">
        <button onclick="initPeer()">Join App</button>
    </div>

    <!-- Step 2: Call Screen -->
    <div id="call-ui">
        <div class="card" style="max-width: 100%; margin-top: 0;">
            <p>Your Username: <strong id="my-id-display" style="color: #38bdf8;"></strong></p>
            
            <div style="display: flex; gap: 8px;">
                <input type="text" id="remote-id-input" placeholder="Friend's Username">
                <button onclick="makeCall()" style="width: auto;">Call</button>
                <button onclick="endCall()" class="btn-danger" style="width: auto;">Hang Up</button>
            </div>
        </div>

        <div class="video-container">
            <div class="video-box">
                <video id="local-video" autoplay muted playsinline></video>
                <div class="video-label">You</div>
            </div>
            <div class="video-box">
                <video id="remote-video" autoplay playsinline></video>
                <div class="video-label">Friend</div>
            </div>
        </div>
    </div>

    <script>
        let peer = null;
        let localStream = null;
        let currentCall = null;

        // Initialize Peer connection using free public PeerJS server
        async function initPeer() {
            const username = document.getElementById('username-input').value.trim().toLowerCase();
            if (!username) return alert('Please enter a username');

            // Request camera & microphone permissions
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('local-video').srcObject = localStream;
            } catch (err) {
                alert('Camera & Microphone access is required: ' + err.message);
                return;
            }

            // Connect to PeerJS server using chosen username as Peer ID
            peer = new Peer(username);

            peer.on('open', (id) => {
                document.getElementById('login-ui').style.display = 'none';
                document.getElementById('call-ui').style.display = 'block';
                document.getElementById('my-id-display').innerText = id;
            });

            // Handle errors (e.g., username already taken)
            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    alert('That username is already taken. Please pick another one.');
                } else {
                    alert('Connection Error: ' + err.type);
                }
            });

            // Handle Incoming Calls
            peer.on('call', (call) => {
                const acceptCall = confirm(`Incoming call from: ${call.peer}. Answer?`);
                if (acceptCall) {
                    call.answer(localStream); // Send local stream back to caller
                    currentCall = call;

                    call.on('stream', (remoteStream) => {
                        document.getElementById('remote-video').srcObject = remoteStream;
                    });

                    call.on('close', () => {
                        document.getElementById('remote-video').srcObject = null;
                    });
                }
            });
        }

        // Call another user by username
        function makeCall() {
            const remoteId = document.getElementById('remote-id-input').value.trim().toLowerCase();
            if (!remoteId) return alert("Enter your friend's username");

            const call = peer.call(remoteId, localStream);
            currentCall = call;

            call.on('stream', (remoteStream) => {
                document.getElementById('remote-video').srcObject = remoteStream;
            });

            call.on('close', () => {
                document.getElementById('remote-video').srcObject = null;
            });
        }

        // Hang up call
        function endCall() {
            if (currentCall) {
                currentCall.close();
                document.getElementById('remote-video').srcObject = null;
            }
        }
    </script>
</body>
</html>
